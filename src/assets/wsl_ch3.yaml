- area: M-McRonalds
  background: WS Lambda/Montreal/McRonalds [Day]
  background_tod:
    day: WS Lambda/Montreal/McRonalds [Day]
    evening: WS Lambda/Montreal/McRonalds [Day]
    night: WS Lambda/Montreal/McRonalds [Day]
  reachable_areas: WS Lambda RP Hub, M-Plaza
  scream_range: <REACHABLE_AREAS>
  default_description: 'No matter where you come from, it''s always the same. McRonalds
    hasn''t changed at all, you see. It''s the same old crowded place with countless
    customers eager to get their hands on the finest cuisine of fast food at the lowest
    possible price.


    They have a promotion, it seems. It''s called "The Resigned McCage". It''s supposed
    to be the grandiose meal that a bird ate during its time in the cage. The meal
    is so delicious that even when the cage is open, the bird stays there. That is
    the gist of it. The meal set consists of two cheeseburgers, a drink, and large
    fries. A set is only for $9.99.'
