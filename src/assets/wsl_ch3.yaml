- area: M-Hotel Room 1
  background: WS Lambda/Montreal/Hotel Room [Day]
  background_tod:
    day: WS Lambda/Montreal/Hotel Room [Day]
    evening: WS Lambda/Montreal/Hotel Room [Evening]
    night: WS Lambda/Montreal/Hotel Room [Night]
  reachable_areas: WS Lambda RP Hub, M-Hotel Lobby
  scream_range: <REACHABLE_AREAS>
  default_description: 'You reached your hotel room after a brief stroll from the
    lobby, passing through a long corridor. The room was spacious and cosy, with a
    touch of tropical flair. On the wall was not a real window, but a clever projection
    that simulated the scenery of an island. You could see the sun rise and set, the
    waves crash and recede, and the palm trees sway and rustle. But beyond the screen
    itself there is a window whose curtains you can draw if you want some privacy.


    On a counter next to the door, you found some coffee sachets and a kettle to make
    yourself a hot drink. There was no TV in the room, which you found odd, but there
    were two double beds, even though you couldn''t see the other one from this view.
    They were soft and bouncy, and the air-conditioning was superb.'
