- area: M-Souvenir Shop
  background: WS Lambda/Montreal/Souvenir Shop [Day]
  background_tod:
    day: WS Lambda/Montreal/Souvenir Shop [Day]
    evening: WS Lambda/Montreal/Souvenir Shop [Day]
    night: WS Lambda/Montreal/Souvenir Shop [Day]
  reachable_areas: WS Lambda RP Hub, M-Plaza
  scream_range: <REACHABLE_AREAS>
  default_description: 'This was previously thrashed, but seems to be fixed. 


    The setting is a souvenir shop, what more is there to say?
    Despite its impressive architecture, cheap trinkets are scattered around the store
    that are up for grabs. One of the more expensive souvenirs is a model of a Canadian
    ship. It appears to be the HMCS Avant-Garde Delta, a rather old-fashioned vessel
    that looks more like a pirate ship than a modern warship. It is mostly made of
    wood, unlike the metal-coated ships that were common in World War 2. Perhaps that
    is why it was named "Avant-Garde Delta", as a contrast to the norm. This ship
    was first used in late 1940, as a means of transporting people from one place
    to another. Its wooden structure was supposed to signal its neutrality, as it
    was not involved in the war. However, that is only a theory.


    The ship was last seen in the middle of the Atlantic Ocean, on its way from Europe
    to North America, in 1941. It was rumoured to have carried an important hostage,
    but no one ever found out who it was.'
