  default_description: 'On the desolate shore stretches an expanse of sand, gradually
    giving way to lush greenery that meanders towards the looming forests. Apart from
    the remnants of oceanic detritus littering the beach, there is little else of
    significance to be found in this forlorn location.


    Having made her decision, the Oracle decreed that this was the ideal location
    to establish a base and encampment. The tent appeared resilient, yet there lingered
    a hope that it would withstand the forceful winds that often swept through the
    shores. The comforting heat from the campfire shields one from the biting chill
    of the blustery nights.

    '
