  scream_range: <REACHABLE_AREAS>
  default_description: "Welcome to Lambda Islands, where the sea rivals the beauty\
    \ of the island itself, which, from this position hides it from view. And here\
    \ you stand, upon a small rocky platform barely above the ocean's surface. The\
