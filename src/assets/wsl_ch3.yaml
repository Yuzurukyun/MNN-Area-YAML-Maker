- area: M-Fountain
  background: WS Lambda/Montreal/Fountain [Day]
  background_tod:
    day: WS Lambda/Montreal/Fountain [Day]
    evening: WS Lambda/Montreal/Fountain [Day]
    night: WS Lambda/Montreal/Fountain [Day]
  reachable_areas: WS Lambda RP Hub, M-Hotel Lobby, M-Plaza
  scream_range: <REACHABLE_AREAS>
  default_description: "A clear fountain sparkles in the sun, surrounded by several\
    \ buildings. One of them is the Hotel L'archipel des Tra\xEEtres, a luxurious\
    \ establishment you are currently residing in and the other is a path that leads\
    \ to the Plaza, a popular spot for the locals. This place seems like an ideal\
    \ destination for relaxation and entertainment. On the streets, a gossip magazine\
    \ catches your eye.\n\nThe Akaikami Family Heist and the Secret of Lambda Archipelago.\
    \ \nTwo headlines that have nothing in common, except for their mystery and intrigue.\
    \ The magazine does not offer much detail, as usual, but it hints at some fascinating\
    \ stories. The former is about an influential Japanese family in the business\
    \ world, who suffered a huge loss in 1935. Someone stole about 10,000 US Dollars\
    \ from them (converted from Japanese Currency), which would be equivalent to 225,000\
    \ dollars in 2020, accounting for inflation. The culprit was never found, but\
    \ some speculate that it was the disgraced younger brother, who was banished from\
    \ the family but still carried the Akaikami name.\n\nThe latter is about a remote\
    \ island that is off-limits to most people. Anyone who tries to enter without\
    \ authorised access could face imprisonment, or worse. But over the years, especially\
    \ after the 1980s, such a warning has become more of a formality it seems."
