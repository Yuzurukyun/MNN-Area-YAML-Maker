    night: WS Lambda/Montreal/Coastline [Night]
  reachable_areas: WS Lambda RP Hub, M-Lambda Islands Coast
  scream_range: <REACHABLE_AREAS>
  default_description: Far from the heart of Quebec, this lies in the northern reaches,
    far from approaching the threshold where the arctic snows would reign. Thankfully,
    it's summer, so the chill is not as daunting, certainly not akin to the snowfall
    one might expect in this vicinity. Nearing the border of another Canadian province,
    this coastal stretch presents a splendid, balmy panorama. Further along, an amusement
    park awaits the delight of the locals, alongside a teleporter in close proximity.
    Naturally, the teleporter leads towards the sea.
