- area: M-Hotel Lobby
  background: WS Lambda/Montreal/Hotel Lobby [Day]
  background_tod:
    day: WS Lambda/Montreal/Hotel Lobby [Day]
    evening: WS Lambda/Montreal/Hotel Lobby [Evening]
    night: WS Lambda/Montreal/Hotel Lobby [Night]
  reachable_areas: WS Lambda RP Hub, M-Fountain, M-Hotel Room 1, M-Hotel Room 2, M-Hotel
    Room 3, M-Hotel Room Kayode
  scream_range: <REACHABLE_AREAS>
  default_description: "The hotel was a masterpiece of whimsy, adorned with lavish\
    \ furniture and ornaments that exuded class and elegance. As you walked past the\
    \ bustling reception desk, you caught a glimpse of a high-end restaurant, where\
    \ well-dressed patrons savoured exquisite dishes. You felt a pang of envy, knowing\
    \ that the Oracle and Commander had only booked everyone the standard rooms, and\
    \ that you were barred from entering the exclusive lounge. You shrugged it off,\
    \ telling yourself that you would have more fun exploring the city than staying\
    \ in the hotel.\n\nThe hotel had a unique feature: it was designed to resemble\
    \ an island resort... even though it was located in the heart of Montreal, far\
    \ from any coast. The windows, except for the main ones, were actually screens\
    \ that created a realistic illusion of a tropical paradise. At the end of the\
    \ hall, you noticed a golden plaque that displayed the history of the hotel and\
    \ a quirky motto.\n\nHistory of Hotel L'archipel des Tra\xEEtres\n-> 1976 - Agreed\
    \ to Locate at an Island\n-> 1977 - Plans Cancelled\n-> Open for Business on December,\
    \ 1979 \n\n\"When life gives you lemons, punch life in the throat.\"\n"
