    M-Souvenir Shop, M-Ballmart
  scream_range: <REACHABLE_AREAS>
  default_description: 'Ignore the Japanese signs as they are simply for show. This
    is Montreal as always, but with a twist. It seems to indicate that all of these
    are part of the Delta event, as explained by a large signboard in the centre of
    the plaza. The signboard also defines Delta as a difference or a change of something.
    The event will last for a month, and the person who makes the most change will
    win a prize.


    Besides that,there are many places to choose from but you can only enter so many.
    Enjoy the Plaza of Montreal!'
