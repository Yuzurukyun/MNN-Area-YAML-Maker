- area: M-Ballmart
  background: WS Lambda/Montreal/Supermarket [Day]
  background_tod:
    day: WS Lambda/Montreal/Supermarket [Day]
    evening: WS Lambda/Montreal/Supermarket [Day]
    night: WS Lambda/Montreal/Supermarket [Day]
  reachable_areas: WS Lambda RP Hub, M-Plaza
  scream_range: <REACHABLE_AREAS>
  default_description: "You are in Ballmart, a place of \u201Cwonder and variety\u201D\
    . There are so many aisles that you could easily get lost among the countless\
    \ items for sale. There is no need to explain what Ballmart is, as its nature\
    \ is obvious.\n\nOn the discount aisle, you spot an image puzzle. It looks like\
    \ a fun challenge, and you are tempted to buy it, if no one else has already.\
    \ The puzzle is dedicated to person named Benjamin Beaulieu, a prominent figure\
    \ from Quebec and the founder of Beaulieu Solars. You are familiar with Beaulieu\
    \ Solars, especially as a Canadian. It is the leading solar panel energy provider\
    \ of the past and present.\n\nAccording to history, Beaulieu Solars was on the\
    \ verge of bankruptcy due to its poor start and frequent failures, but it managed\
    \ to find a foreign investor who helped the company to revive and generate hundreds\
    \ of thousands of revenues in a few years. This success continues to this day,\
    \ although Beaulieu Solars is not as widely used as it was before the war.\n\n\
    Not much is known about what happened to Benjamin Beaulieu after he vanished without\
    \ a trace in 1939."
