- area: M-Recreational Facility
  background: WS Lambda/Montreal/Recreational Facility [Day]
  background_tod:
    day: WS Lambda/Montreal/Recreational Facility [Day]
    evening: WS Lambda/Montreal/Recreational Facility [Day]
    night: WS Lambda/Montreal/Recreational Facility [Day]
  reachable_areas: WS Lambda RP Hub, M-Plaza
  scream_range: <REACHABLE_AREAS>
  default_description: 'The scene is a bustling recreational facility that offers
    a variety of fun activities. From the entrance, one can see customers enjoying
    pool and bowling, among other things. There is much more to explore, but it would
    take too long to list them all.


    Near the cashier, a stack of books is on sale. The title reads "Mysterical Arguments",
    a peculiar name indeed. The author is Layla Fischer, a German Practitioner who
    writes as a hobby. The book is quite popular for a piece of literature that was
    written over 85 years ago. It is a mystery novel with an unusual premise: a storyteller
    and a group of participants argue about how a murder occurred. It is essentially
    a debate-based mystery with a touch of social deduction.


    The storyteller uses "Red Statements" to convey facts that are perfectly correct
    and is whenever they are required to. The storyteller must respond to "Blue Statements"
    made by participants with Red Statements, as long as the Blue Statements are valid.
    Their validity depends on whether the Blue Statement is relevant to the mystery
    and not game-breaking. For example, a Blue Statement like "Who is the murderer?"
    is invalid. There are also rare "Purple Statements" that can only be used during
    the storyteller''s narration. They indicate that something is important, and that
    it is either a complete truth or a complete lie, with no middle ground.


    The novel does not provide the answers to the mystery, but challenges the reader
    to solve it on their own. It also hints at where the real truth can be found.
    To this day, the real truth has never been revealed, as the author went missing
    in 1941 and it was speculated that World War 2 had destroyed the remaining clues
    and possibly the author herself.'
  bglock: false
  bullet: true
  cbg_allowed: true
  change_reachability_allowed: true
